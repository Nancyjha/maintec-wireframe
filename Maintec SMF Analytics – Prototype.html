<div class="top"><div class="lm"><b>MS</b></div><div class="br">Maintec SMF Analytics</div><nav id="nav"></nav><div style="margin-left:auto;padding-right:12px"><select id="env" aria-label="Environment"><option value="All">Env: All</option><option value="Prod">Production</option><option value="Test">Test</option><option value="Dev">Development</option></select></div></div>

<script>
const $=s=>document.querySelector(s),C=['#6d28d9','#059669','#b45309','#1d4ed8','#dc2626','#0891b2','#be185d','#65a30d'],hs=s=>[...s].reduce((h,c)=>h*31+c.charCodeAt(0)|0,7),col=n=>C[Math.abs(hs(n))%8];

lab=g=>g=='H'?[...Array(24).keys()].map(i=>String(i).padStart(2,'0')):g=='D'?[...Array(20).keys()].map(i=>((S.cyc-1+i)%30)+1):['Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct'],

(o.lines||[]).forEach(x=>{let d='';o.labels.forEach((_,i)=>{const v=lv(x,i);if(v!=null)d+=(d?'L':'M')+X(i)+' '+Y(v)});s+=`<path d="${d}" fill="none" stroke="${x.color||'#dc2626'}" stroke-width="1.8" stroke-dasharray="${x.dash||'6 4'}"/>`});

tip.style.display='block';tip.style.left=Math.min(e.clientX+12,innerWidth-270)+'px';tip.style.top=e.clientY+12+'px';tip.innerHTML=`<b>${o.labels[i]}</b> · ${o.unit||''}<br>`+Sx.filter(z=>z.data[i]!=null).map(z=>`${z.name}: ${f(z.data[i])}`).join('<br>')+(mode!='line'?`<br><b>Total: ${f(tops[i])}</b>`:'')+(o.lines||[]).map(x=>`<br>${x.name}: ${f(lv(x,i))}`).join('')};

const NAVS={exec:'Executive Dashboard',cap:'Capacity & Workload Analysis',health:'System Health',ai:'AI Insights',data:'Data Sources & History'};

<div class="tiles"><div class="tile"><small>Total to date (20 days)</small><b>${fm(F.total)}</b><i>MSU-h · measured</i></div><div class="tile ${F.cross?'fl':'ok'}"><small>Forecast cycle total (prediction)</small><b>${fm(F.fin)}</b><i>range ${fm(F.lo[29])}–${fm(F.hi[29])} · data coverage 20 days</i></div><div class="tile"><small>Cycle threshold (configured)</small><b>${fm(S.mthr)}</b><i>source: customer config · illustrative</i></div><div class="tile ${F.cross?'fl':'ok'}"><small>Threshold status</small><b style="font-size:15px">${F.cross?'▲ Forecast to cross on day '+F.cross:'✓ Not forecast to cross'}</b><i>prediction, not measured</i></div></div>
<div class="g11"><div class="card"><div class="ch"><div><b>Daily MSU-hours</b><small>stacked by ${DIMS[S.dim]} · vs daily share of threshold</small></div><button class="btn" onclick="csv('c_d')">Export CSV</button></div><div class="cb" id="c_d"></div></div><div class="card"><div class="ch"><div><b>Accumulated MSU-hours – actual vs forecast</b><small>forecast = recent-trend extrapolation with ± 1σ range</small></div></div><div class="cb" id="c_c"></div></div></div>
<h2 id="c"><span>C / D</span> · CPC capacity & overall hourly utilization</h2><p class="sub">Utilization = hourly average MSU ÷ configured MSU capacity (sum of CPC capacities). Threshold ${S.thr}% is configurable (source: this filter bar), not a universal limit.</p>
<div class="card"><div class="tw"><table><thead><tr><th>CPC</th><th>HW model</th><th>SW model</th><th>MSU capacity</th><th>Avg MSU (day)</th><th>Peak util.</th><th>Threshold</th><th>Headroom at peak</th></tr></thead><tbody>${cs.map(c=>{const p=Math.max(...c.data),a=c.data.reduce((x,y)=>x+y,0)/24,q=CPC[c.name];return`<tr class="cl" onclick="S.path=['${c.name}'];S.tab='cap';R()"><td><b>${c.name}</b></td><td>${q.hw}</td><td>${q.sw}</td><td>${fm(q.cap)}</td><td>${fm(a)}</td><td>${(p/q.cap*100).toFixed(0)}% ${p/q.cap*100>S.thr?'▲':'✓'}</td><td>${S.thr}%</td><td>${fm(q.cap-p)} MSU</td></tr>`}).join('')}</tbody></table></div></div>
<div class="g11"><div class="card"><div class="ch"><div><b>Hourly average MSU by CPC</b><small>click a CPC in the legend to drill down</small></div><button class="btn" onclick="csv('c_x')">Export CSV</button></div><div class="cb" id="c_x"></div></div><div class="card"><div class="ch"><div><b>Overall hourly utilization %</b><small>total vs ${S.thr}% threshold ${S.cmp?'· dashed grey = previous day':''}</small></div></div><div class="cb" id="c_u"></div></div></div>
<h2 id="e"><span>E–G</span> · CPC → LPAR → workload → address space</h2><div class="card"><div class="cb">Drill from any CPC through LPAR, workload and address space, preserving filters. <button class="btn" onclick="S.path=[];S.tab='cap';R()">Open Capacity & Workload Analysis →</button></div></div>
<h2 id="h"><span>H</span> · WLM service classes</h2>${wlm(L)}`;
$('#tl').innerHTML=K.map((q,i)=>{const v=kval(q),o=ok(q,v);return`<button class="tile ${o==null?'':o?'ok':'fl'} ${i==S.kpi?'on':''}" onclick="S.kpi=${i};R()"><small>${q.n}</small><b>${v.toFixed(q.f)}${q.u}</b><i>${q.tg==null?'No target configured':(o?'✓ Within target ':'▲ Outside target ')+(q.d>0?'≥ ':'≤ ')+q.tg+q.u}</i></button>`}).join('');
const ks=kser(k,gs,g,n),ln=k.tg==null?[]:[{name:'Target '+k.tg+k.u,v:k.tg}];
chart('c_h',{labels:lab(g),series:ks,mode:k.add?'stack':'line',lines:ln,unit:k.u,ymin:k.y,f:v=>v.toFixed(k.f)+(k.u||''),title:k.n});
$('#rk').innerHTML=RISK.map((r,i)=>`<div class="rk"><span class="bd ${r[1]}">${r[0]}</span> <b>${i==3&&F.cross?'Forecast crossing of cycle threshold':r[2]}</b><p>${i==3?(F.cross?`Prediction: cumulative MSU-h projected to pass ${fm(S.mthr)} around day ${F.cross} (forecast range ${fm(F.lo[29])}–${fm(F.hi[29])} by cycle end). Assumes recent trend continues.`:'Prediction: cumulative MSU-h not projected to exceed the configured threshold.'):r[3]}</p></div>`).join('');
const dd=grp(L,S.dim,'D').map(s=>({...s,data:s.data.map(x=>x*24)}));
chart('c_d',{labels:lab('D'),series:dd,mode:'bar',lines:[{name:'Threshold ÷ 30',v:S.mthr/30}],unit:'MSU-h',title:'Daily MSU-hours'});
chart('c_c',{labels:[...lab('D'),...Array.from({length:10},(_,i)=>((S.cyc+19+i)%30)+1)],mode:'line',unit:'MSU-h',title:'Accumulated',series:[{name:'Actual',color:'#6d28d9',data:[...F.act,...Array(10).fill(null)]},{name:'Forecast',color:'#b45309',dash:1,data:F.mid},{name:'Low',color:'#94a3b8',dash:1,data:F.lo},{name:'High',color:'#94a3b8',dash:1,data:F.hi}],lines:[{name:'Cycle threshold',v:S.mthr}]});
chart('c_x',{labels:lab('H'),series:cs,unit:'MSU',lines:[{name:'Capacity '+fm(cap),v:cap,dash:'2 0',color:'#0f172a'},{name:S.thr+'% threshold',v:cap*S.thr/100}],click:n=>{S.path=[n];S.tab='cap';R()},title:'Hourly MSU by CPC'});
chart('c_u',{labels:lab('H'),mode:'line',unit:'%',f:v=>v.toFixed(0)+'%',series:[{name:'Utilization',color:'#6d28d9',data:T.map(x=>x/cap*100)},...(S.cmp?[{name:'Previous day',color:'#94a3b8',dash:1,data:T.map((x,i)=>x/cap*100*(.94+.08*Math.sin(i)))}]:[])],lines:[{name:S.thr+'% threshold',v:S.thr}],title:'Utilization'})}
const WL=[['CICSHI','Avg RT 0.2 s',1,'CICS regions','Yes','Yes','None',.82],['CICSMD','Avg RT 0.5 s',2,'CICS (other)','Yes','No','None',.95],['DB2HI','Velocity 70',1,'DB2 DBM1/DIST','Yes','Yes','None',.88],['TSOPRD','90% < 0.5 s',2,'TSO production users','No','No','None',1.04],['BATCHP','Velocity 40',3,'Production batch','No','No','None',1.12],['BATCHL','Discretionary',5,'Low-priority batch','No','No','Resource group max (illustrative)',null],['SYSSTC','System',0,'System STCs','Yes','Yes','None',null]];
function wlm(L){const m=Object.fromEntries(grp(L,'wlm','D').map(s=>[s.name,s.data.reduce((a,b)=>a+b,0)/20]));return`<p class="sub">Observed vs goal: PI &gt; 1 means the goal was missed. Mismatch is flagged only where measured; no configuration change is recommended from a field value alone.</p><div class="card"><div class="tw"><table><thead><tr><th>Service class</th><th>Goal</th><th>Importance</th><th>Classification</th><th>CPU critical</th><th>Mem critical</th><th>Capping</th><th>Avg MSU</th><th>Observed PI</th></tr></thead><tbody>${WL.map(w=>`<tr><td><b>${w[0]}</b></td><td>${w[1]}</td><td>${w[2]||'–'}</td><td>${w[3]}</td><td>${w[4]}</td><td>${w[5]}</td><td>${w[6]}</td><td>${fm(m[w[0]]||0)}</td><td>${w[7]==null?'<span class="bd nu">No data</span>':`${w[7]} <span class="bd ${w[7]>1?'fl':'ok'}">${w[7]>1?'▲ Goal missed':'✓ Met'}</span>`}</td></tr>`).join('')}</tbody></table></div></div>`}
const LV_=['cpc','lpar','wl','as'],LN=['Installation','CPC','LPAR','Workload','Address space'];
function cap(){const L=fl().filter(l=>S.path.every((p,i)=>l[LV_[i]]==p)),d=S.path.length,g=S.g,cp=S.path[0];
const info=d==0?'':d==1?`<tr><th>CPC</th><td>${cp}</td><th>HW / SW model</th><td>${CPC[cp].hw} / ${CPC[cp].sw}</td><th>MSU</th><td>${fm(CPC[cp].cap)}</td><th>General CPs</th><td>${CPC[cp].cp}</td><th>zIIP / ICF / IFL</th><td>Not in source</td><th>Memory</th><td>${CPC[cp].mem}</td></tr>`:'';
const lps=Object.entries(LP).filter(([k,v])=>(!cp||v[0]==cp)&&(d<2||k==S.path[1]));
$('#m').innerHTML=`<h2 style="margin-top:0">Capacity & Workload Analysis</h2><div class="bc"><button onclick="S.path=[];R()">Installation</button>${S.path.map((p,i)=>`<span>›</span><button onclick="S.path=S.path.slice(0,${i+1});R()">${p}</button>`).join('')}${d>0?`<button class="btn" onclick="S.path=S.path.slice(0,-1);R()">↑ Parent</button>`:''}</div>
${d>=1&&d<4&&info?`<div class="card"><div class="tw"><table><tr>${info.replace(/<\/?tr>/g,'')}</tr></table></div></div>`:''}
<div class="card"><div class="ch"><div><b>${d<4?`${GR[g]} by ${LN[d+1]}`:'Address space '+S.path[3]+' – area chart'}</b><small>${S.path.join(' › ')||'All CPCs'} · measured, aggregated from address-space records · click a legend entry to drill${d>=4?' (deepest level)':''}</small></div><button class="btn" onclick="csv('c_k')">Export CSV</button></div><div class="cb" id="c_k"></div></div><div id="dt"></div>`;
const se=d<4?grp(L,LV_[d],g):[{name:S.path[3],color:col(S.path[3]),data:tot(L,g)}];
chart('c_k',{labels:lab(g),series:se,unit:'MSU',click:d<3?n=>{S.path=[...S.path,n];R()}:d==3?n=>{S.path=[...S.path,n];R()}:null,title:'Drill',lines:d==1?[{name:'Capacity '+fm(CPC[cp].cap),v:CPC[cp].cap,dash:'2 0',color:'#0f172a'},{name:S.thr+'% threshold',v:CPC[cp].cap*S.thr/100}]:[]});
$('#dt').innerHTML=d<4?`<div class="card"><div class="tw"><table><thead><tr><th>${LN[d+1]}</th><th>Avg MSU</th><th>Peak MSU</th><th>Share</th>${d>=1&&d<3?'<th>Weight</th><th>CP</th><th>zIIP</th><th>Memory GB</th>':''}</tr></thead><tbody>${(()=>{const T=se.reduce((a,s)=>a+s.data.reduce((x,y)=>x+y,0),0);return se.map(s=>{const a=s.data.reduce((x,y)=>x+y,0)/s.data.length,v=LP[s.name];return`<tr class="cl" onclick="S.path=[...S.path,'${s.name}'];R()"><td><b>${s.name}</b></td><td>${fm(a)}</td><td>${fm(Math.max(...s.data))}</td><td>${(s.data.reduce((x,y)=>x+y,0)/T*100).toFixed(0)}%</td>${d>=1&&d<3?(v?`<td>${v[3]}</td><td>${v[4]}</td><td>${v[5]}</td><td>${v[6]}</td>`:'<td colspan=4 class="sub">Config shown at LPAR level</td>'):''}</tr>`}).join('')})()}</tbody></table></div></div>`:`<div class="card"><div class="cb"><span class="bd nu">No data</span> Transaction/job/user-level detail (CICS transactions, TSO users, Db2 activity, batch jobs) is not ingested in this prototype. It is shown as unavailable, not as zero.</div></div>`}
function health(){$('#m').innerHTML=`<h2 style="margin-top:0">System Health</h2><p class="sub">Definitions, targets and data availability for the 11 required KPIs. Availability, incident and DASD data need sources beyond SMF; until configured they are shown as unverified.</p><div class="card"><div class="tw"><table><thead><tr><th>KPI</th><th>Current</th><th>Target</th><th>Status</th><th>Aggregation</th><th>Source (to be validated)</th></tr></thead><tbody>${K.map((k,i)=>{const v=kval(k),o=ok(k,v);return`<tr class="cl" onclick="S.kpi=${i};S.tab='exec';R()"><td><b>${k.n}</b></td><td>${v.toFixed(k.f)}${k.u}</td><td>${k.tg==null?'Not configured':(k.d>0?'≥ ':'≤ ')+k.tg+k.u}</td><td><span class="bd ${o==null?'nu':o?'ok':'fl'}">${o==null?'No target':o?'✓ Within':'▲ Outside'}</span></td><td>${k.add?'Sum':k.n.includes('Peak')?'Max over interval':'Mean'}</td><td>${['availability','Critical app','incidents','DASD'].some(x=>k.n.includes(x))?'External source required':'RMF/SMF 70-72, 30, 74, 110 (mapping TBC)'}</td></tr>`}).join('')}</tbody></table></div></div>`}
function ai(){const L=fl();$('#m').innerHTML=`<h2 style="margin-top:0">AI Insights</h2><p class="sub">Answers are produced from computed analytics, with evidence and limits shown. Facts, inference and prediction are labelled separately.</p><div class="card"><div class="cb"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="btn" data-q="0">Which CPC had the highest utilization yesterday?</button><button class="btn" data-q="1">Will we cross the cycle threshold?</button><button class="btn" data-q="2">Which workload drove the increase?</button></div><div id="ans" class="sub">Pick a question.</div></div></div>
<div class="card"><div class="ch"><b>Proposed operational action (approval workflow)</b><span class="bd nu">Non-executing</span></div><div class="cb"><p><b>Proposal:</b> review BATCHL capping during 10:00–16:00 peak.</p><p class="sub">Evidence: TSOPRD PI 1.04 overlaps BATCHP peak (correlation only). Target system, exact operation, expected impact and dry-run require a configured allow-listed connector. None is configured, so execution is disabled and nothing is simulated.</p><button class="btn" disabled>Approve & execute (unavailable)</button></div></div>`;
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=+b.dataset.q;let h;if(q==0){const c=grp(L,'cpc','H').map(s=>[s.name,Math.max(...s.data)/CPC[s.name].cap*100]).sort((a,b)=>b[1]-a[1])[0];h=`<b>Fact:</b> ${c[0]} peaked at ${c[1].toFixed(0)}% of configured capacity on ${S.date}.<br><b>Baseline:</b> ${S.thr}% threshold – ${c[1]>S.thr?'exceeded':'not exceeded'}.<br><b>Evidence:</b> hourly average MSU, CPC aggregate (Executive Dashboard C).<br><b>Limitations:</b> sample data; 1-hour averages can hide shorter peaks.`}else if(q==1){const F=fc(L);h=`<b>Prediction:</b> ${F.cross?'cycle total projected to pass '+fm(S.mthr)+' MSU-h around day '+F.cross:'no crossing projected'} (forecast ${fm(F.fin)}, range ${fm(F.lo[29])}–${fm(F.hi[29])}).<br><b>Assumptions:</b> last-14-day trend continues.<br><b>Confidence:</b> low–moderate: only 20 days of history, no seasonality fitted.`}else{const w=grp(L,'wl','D').map(s=>[s.name,s.data.slice(-7).reduce((a,b)=>a+b,0)/7-s.data.slice(0,7).reduce((a,b)=>a+b,0)/7]).sort((a,b)=>b[1]-a[1])[0];h=`<b>Fact:</b> ${w[0]} grew most (+${fm(w[1])} avg MSU, last 7 vs first 7 days).<br><b>Inference:</b> cause not established; correlation with a trend, not proven causation.<br><b>Next step:</b> inspect address spaces under ${w[0]} in Capacity & Workload.`}$('#ans').innerHTML=h})}
function data(){$('#m').innerHTML=`<h2 style="margin-top:0">Data Sources & History</h2><div class="card"><div class="ch"><b>Historical SMF upload</b></div><div class="cb"><div class="dz">No SMF data uploaded.<br><br><input type="file" id="up"><p class="sub" id="us">Accepted: raw SMF dump / RDW-framed datasets. Prototype checks the name only; real validation (framing, record types, duplicates) needs the backend.</p></div></div></div><div class="card"><div class="ch"><b>Continuous collection</b></div><div class="tw"><table><thead><tr><th>Connector</th><th>Status</th><th>Last collection</th><th>Freshness</th></tr></thead><tbody><tr><td>IBM Z direct collector</td><td><span class="bd nu">Not configured</span></td><td>–</td><td>Unknown (not healthy)</td></tr></tbody></table></div><p class="note">Continuous collection is not claimed until a real connector is configured and tested.</p></div><div class="card"><div class="ch"><b>Sample dataset in use</b></div><div class="cb">Illustrative · 5 LPARs · 2 CPCs · 20 days daily / 12 months monthly · retention policy: not configured.</div></div>`;$('#up').onchange=e=>{const f=e.target.files[0];$('#us').textContent=f?`${f.name} (${f.size.toLocaleString()} bytes): queued – not parsed in prototype.`:''}}
R();
</script></body></html>
